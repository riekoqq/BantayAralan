<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BantayAralan -- Admin</title>
  <script>
    // Apply a saved dark-mode preference before first paint, so the page
    // never flashes light-then-dark on load. See frontend/js/theme.js for
    // the full API (used by the sidebar toggle).
    (function () {
      try {
        if (localStorage.getItem("bantayaralan-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="mobile-topbar">
      <div class="wordmark"><div class="mark"></div><span>BantayAralan</span></div>
      <nav class="mobile-nav" id="mobile-nav"></nav>
    </header>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main" id="view-root">
      <div class="state-panel">
        <p class="state-title">Loading BantayAralan…</p>
      </div>
    </main>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/events.js"></script>
  <script src="/js/views/eventDetail.js"></script>
  <script src="/js/views/headcount.js"></script>
  <script src="/js/views/insights.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
